<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="cryptocurrency-portfolio-icon.webp" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="prefetch" href="/index.html">
    <link rel="prefetch" href="/transactions.html">
    <link rel="prefetch" href="/unrealizedPnL.html">
    <link rel="stylesheet" href="PnL.css">
    <script type="module" src="realizedPnL.js" defer></script>
    <title>Результат торговли</title>
</head>
<body>
    <div class="app">
        <div class="container">
            <h1>Результат торговли</h1>
            <div class="file-db">
                 <div class="upload" title="Загрузить файл БД">
                    <input type="file" accept="application/json">
                    <span class="upload__btn small-btn">↑</span>
                </div>
                <a class="download small-btn"  download="cp.json" title="Скачать файл БД" tabindex="0">↓</a>
            </div>
              <div style="margin-bottom: 10px; width: min-content; margin-left: auto;">
                <button class="sort-btn small-btn" title="Сортировать по прибыли">
                    <svg width="16" height="17" viewBox="0 0 16 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.7861 7H2.21387L8 0.736328L13.7861 7Z" fill="white" stroke="black"/>
                        <path d="M2.21387 10L13.7861 10L8 16.2637L2.21387 10Z" fill="white" stroke="black"/>
                    </svg>
                </button>
            </div>
            <div style="overflow: auto; padding-bottom: 10px;">
                <table class="pairs">
                    <thead>
                        <tr>
                            <th style="min-width: 105px">Монета</th>
                            <th style="min-width: 105px">Прибыль</th>
                            <th style="min-width: 105px">Доходность</th>
                            <th style="min-width: 105px">Инвестировано</th>
                        </tr>
                    </thead>
            <custom-nav data-active-link="3"></custom-nav>
        </div>
    </div>
</body>
</html>
