<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="cryptocurrency-portfolio-icon.webp" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="prefetch" href="/transactions.html">
    <link rel="prefetch" href="/realizedPnL.html">
    <link rel="prefetch" href="/unrealizedPnL.html">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js" defer></script>
    <title>Кошелек</title>
</head>
<body>
    <div class="app">
        <div class="container">
                <h1>Кошелек</h1>
            <div class="balance">
                <span>Баланс: </span><span class="balance__value"></span>
                <span>Инвестировано:</span><span class="balance__invested"></span>
                <span>Доходность:</span><span class="balance__profit"></span>
            </div>
            <div class="buttons">
                 <div class="upload" title="Загрузить файл БД">
                    <input type="file" accept="application/json">
                    <span class="upload__btn small-btn">↑</span>
                </div>
                <a class="download small-btn"  download="cp.json" title="Скачать файл БД" tabindex="0">↓</a>
                <div style="position:absolute; right: 0;">
                    <button class="sort-btn small-btn" title="Сортировать по стоимости">
                        <svg width="16" height="17" viewBox="0 0 16 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13.7861 7H2.21387L8 0.736328L13.7861 7Z" fill="white" stroke="black"/>
                            <path d="M2.21387 10L13.7861 10L8 16.2637L2.21387 10Z" fill="white" stroke="black"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div style="overflow: auto; padding-bottom: 10px;">
                <table class="coins">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Монета</th>
                            <th>Количество</th>
                            <th style="min-width: 105px;">Цена</th>
                            <th style="min-width: 105px;">Стоимость</th>
                            <th></th>
                        </tr>
                    </thead>
                </table>
            </div>
            <button class="square-btn deposit" title="Внести криптовалюту">
                <img class="navigation__img" src="deposit.png" alt="Внести криптовалюту">
            </button>
            <dialog class="new-coin-modal modal" data-action="">
                <div class="modal__wrap">
                    <input type="number" hidden name="id">
                    <label for="coin">Монета</label>
                    <input type="text" name="coin" id="coin">
                    <label for="amount">Количество</label>
                    <input type="number" name="amount" id="amount">
                    <div class="modal__buttons">
                        <button class="modal-btn modal-btn_ok" disabled>Сохранить</button>
                        <form method="dialog">
                            <button class="modal-btn modal-btn_close">Закрыть</button>
                        </form>
                    </div>
                </div>
            </dialog>
            <custom-nav data-active-link="1"></custom-nav>
        </div>
    </div>
</body>
</html>
